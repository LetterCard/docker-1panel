name: Test Published 1Panel Images

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Docker Hub 命名空间 (默认 bugseeker，可覆盖)"
        required: false
        type: string
        default: "bugseeker"
      tag:
        description: "指定单一 tag 测试 (留空则测试全部 9 个)"
        required: false
        type: string

jobs:
  # ========== 1) 解析待测镜像列表 ==========
  resolve:
    name: Resolve Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: gen
        run: |
          NS="${{ inputs.username }}"
          if [ -z "$NS" ]; then
            NS="bugseeker"
          fi

          if [ -n "${{ inputs.tag }}" ]; then
            MATRIX=$(python3 scripts/resolve-tags.py "$NS" --single "${{ inputs.tag }}")
          else
            # 动态拉取 Docker Hub tags：固定浮动标签 + 最新 V1/V2 版本
            MATRIX=$(python3 scripts/resolve-tags.py "$NS")
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "待测镜像: $(echo "${MATRIX}" | jq -c '.')"

  # ========== 2) 逐镜像全面测试 ==========
  full_test:
    name: Test ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: resolve
    outputs:
      result: ${{ steps.test.outputs.result }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Full Test
        id: test
        env:
          PUBLISHED_DETAIL_FILE: /tmp/published-detail-${{ strategy.job-index }}.txt
        run: |
          bash scripts/published-test.sh "${{ matrix.image }}" "${{ matrix.variant }}"
          code=$?
          if [ "$code" -eq 0 ]; then st="🟢"; else st="🔴"; fi
          echo "result=${{ matrix.image }}|$st" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload Detail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detail-${{ strategy.job-index }}
          path: /tmp/published-detail-${{ strategy.job-index }}.txt
          if-no-files-found: ignore

  # ========== 3) 汇总结果并回写仓库 ==========
  report:
    name: Report & Commit Result
    runs-on: ubuntu-latest
    needs: [resolve, full_test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Details
        uses: actions/download-artifact@v8
        with:
          path: /tmp/details
          pattern: detail-*
          merge-multiple: true
        continue-on-error: true

      - name: Generate Result File
        id: gen
        run: |
          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          PASS=0; FAIL=0; SKIP=0

          # 1) 生成 TEST-RESULT.md 详情（每个镜像一段，<details> 折叠）
          {
            echo "# 1Panel 镜像发布测试结果"
            echo ""
            echo "- 时间: ${NOW}"
            echo "- 触发者: ${{ github.actor }}"
            echo ""
          } > TEST-RESULT.md

          if ls /tmp/details/*.txt >/dev/null 2>&1; then
            for f in /tmp/details/*.txt; do
              img=$(sed -n '1s/^# //p' "$f")
              img_status="🟢"
              img_fail=0
              ROWS_FILE=$(mktemp)
              while IFS='|' read -r name res; do
                echo "| ${name} | ${res} |" >> "$ROWS_FILE"
                if [ "$res" = "🔴" ]; then img_fail=1; img_status="🔴"; fi
              done < <(tail -n +2 "$f")
              {
                echo "<details>"
                echo "<summary>${img} ${img_status}</summary>"
                echo ""
                echo "| 检查项 | 结果 |"
                echo "|---|---|"
                cat "$ROWS_FILE"
                echo ""
                echo "</details>"
              } >> TEST-RESULT.md
              rm -f "$ROWS_FILE"
              if [ "$img_fail" -eq 1 ]; then FAIL=$((FAIL + 1)); else PASS=$((PASS + 1)); fi
            done
          else
            SKIP=1
            echo "（无镜像测试）" >> TEST-RESULT.md
          fi

          {
            echo ""
            echo "---"
            echo "通过: ${PASS} / 失败: ${FAIL} / 跳过: ${SKIP}"
          } >> TEST-RESULT.md

          # 2) 计算整体状态
          if [ "$FAIL" -gt 0 ]; then STATUS="🔴"; elif [ "$SKIP" -gt 0 ]; then STATUS="🟡"; else STATUS="🟢"; fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Commit & Push
        run: |
          STATUS="${{ steps.gen.outputs.status }}"
          PASS="${{ steps.gen.outputs.pass }}"
          FAIL="${{ steps.gen.outputs.fail }}"
          SKIP="${{ steps.gen.outputs.skip }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TEST-RESULT.md
          if git diff --cached --quiet; then
            echo "ℹ️ 结果无变化，跳过提交"
          else
            MSG="chore: 测试结果->${STATUS} (通过 ${PASS} / 失败 ${FAIL} / 跳过 ${SKIP})"
            git commit -m "$MSG"
            tries=0
            until git push; do
              tries=$((tries + 1))
              if [ "$tries" -ge 3 ]; then
                echo "::error::结果推送失败"
                exit 1
              fi
              echo "🔁 远端有更新，rebase 后重试"
              git pull --rebase --autostash
            done
          fi
