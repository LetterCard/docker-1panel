name: Test Published 1Panel Images

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Docker Hub 命名空间 (默认 bugseeker，可覆盖)"
        required: false
        type: string
        default: "bugseeker"
      tag:
        description: "指定单一 tag 测试 (留空则测试全部 9 个)"
        required: false
        type: string

jobs:
  # ========== 1) 解析待测镜像列表 ==========
  resolve:
    name: Resolve Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: gen
        run: |
          NS="${{ inputs.username }}"
          if [ -z "$NS" ]; then
            NS="bugseeker"
          fi

          if [ -n "${{ inputs.tag }}" ]; then
            MATRIX=$(python3 scripts/resolve-tags.py "$NS" --single "${{ inputs.tag }}")
          else
            # 动态拉取 Docker Hub tags：固定浮动标签 + 最新 V1/V2 版本
            MATRIX=$(python3 scripts/resolve-tags.py "$NS")
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "待测镜像: $(echo "${MATRIX}" | jq -c '.')"

  # ========== 2) 逐镜像全面测试 ==========
  full_test:
    name: Test ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: resolve
    outputs:
      detail: ${{ steps.test.outputs.detail }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Full Test
        id: test
        env:
          PUBLISHED_DETAIL_FILE: /tmp/published-detail.txt
        run: |
          bash scripts/published-test.sh "${{ matrix.image }}" "${{ matrix.variant }}"
          code=$?
          if [ "$code" -eq 0 ]; then st="🟢"; else st="🔴"; fi
          # 持久化详情传给 report（多行用 heredoc 分隔符）
          # 首行: IMAGE|VARIANT|STATUS ；之后每行: 检查项|emoji
          {
            echo "detail<<_EOF_"
            echo "${{ matrix.image }}|${{ matrix.variant }}|${st}"
            tail -n +2 /tmp/published-detail.txt
            echo "_EOF_"
          } >> "$GITHUB_OUTPUT"
          exit "$code"

  # ========== 3) 汇总结果并回写仓库 ==========
  report:
    name: Report & Commit Result
    runs-on: ubuntu-latest
    needs: [resolve, full_test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Result File
        id: gen
        env:
          DETAILS: ${{ toJSON(needs.full_test.outputs.detail) }}
        run: python3 scripts/generate-result.py

      - name: Commit & Push
        run: |
          STATUS="${{ steps.gen.outputs.status }}"
          PASS="${{ steps.gen.outputs.pass }}"
          FAIL="${{ steps.gen.outputs.fail }}"
          SKIP="${{ steps.gen.outputs.skip }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TEST-RESULT.md
          if git diff --cached --quiet; then
            echo "ℹ️ 结果无变化，跳过提交"
          else
            MSG="chore: 测试结果->${STATUS} (通过 ${PASS} / 失败 ${FAIL} / 跳过 ${SKIP})"
            git commit -m "$MSG"
            tries=0
            until git push; do
              tries=$((tries + 1))
              if [ "$tries" -ge 3 ]; then
                echo "::error::结果推送失败"
                exit 1
              fi
              echo "🔁 远端有更新，rebase 后重试"
              git pull --rebase --autostash
            done
          fi
