name: Build 1Panel-Global Docker Image

on:
  schedule:
    - cron: "0 14 * * 2"
    - cron: "0 11 * * 5"

  workflow_dispatch:
    inputs:
      target:
        description: "选择构建目标 (Select Build Target)"
        required: true
        default: "All"
        type: choice
        options:
          - All
          - V1
          - V2
      version:
        description: "指定版本号 (选择单个目标时使用；All 留空则分别获取最新版)"
        required: false
        type: string
      force:
        description: "强制重建 (忽略版本比对，直接构建当前跟踪版本)"
        required: false
        type: boolean
        default: false

jobs:
  check_remote:
    name: Check Remote Version
    runs-on: ubuntu-latest
    outputs:
      any_updated: ${{ steps.collect.outputs.any_updated }}
      v1_version: ${{ steps.compare1.outputs.version }}
      v2_version: ${{ steps.compare2.outputs.version }}
      v1_bump: ${{ steps.compare1.outputs.bump }}
      v2_bump: ${{ steps.compare2.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check V1
        id: compare1
        run: |
          verify() {
            local v="$1"
            if [[ -z "$v" || ! "$v" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "::error::Invalid 1Panel version: ${v}"
              exit 1
            fi
          }

          TARGET="${{ inputs.target }}"
          FORCE="${{ inputs.force }}"
          VER_INPUT="${{ inputs.version }}"

          # 手动选择单一目标且不是 V1 时跳过
          if [[ "$TARGET" != "All" && "$TARGET" != "V1" ]]; then
            echo "⏭️ 用户选择 ${TARGET}，跳过 V1 检查"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL=$(cat ./V1/VERSION-GLOBAL)

          # 手动指定版本号（仅单一目标时生效）
          if [[ -n "$VER_INPUT" && "$TARGET" == "V1" ]]; then
            verify "$VER_INPUT"
            echo "👉 V1 使用手动版本: ${VER_INPUT}"
            echo "version=${VER_INPUT}" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 强制重建：直接使用当前跟踪版本
          if [[ "$FORCE" == "true" ]]; then
            echo "🔨 强制重建 V1，使用当前跟踪版本: ${LOCAL}"
            echo "version=${LOCAL}" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 自动：拉取远端最新版本并比对
          REMOTE=$(curl -fsSL "https://resource.1panel.pro/stable/latest")
          verify "$REMOTE"
          if [[ "$REMOTE" == "$LOCAL" ]]; then
            echo "🟢 V1 无更新: ${LOCAL}"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
          else
            echo "🟡 V1 有新版本: ${LOCAL} -> ${REMOTE}"
            echo "version=${REMOTE}" >> "$GITHUB_OUTPUT"
            echo "bump=${REMOTE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check V2
        id: compare2
        run: |
          verify() {
            local v="$1"
            if [[ -z "$v" || ! "$v" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "::error::Invalid 1Panel version: ${v}"
              exit 1
            fi
          }

          TARGET="${{ inputs.target }}"
          FORCE="${{ inputs.force }}"
          VER_INPUT="${{ inputs.version }}"

          # 手动选择单一目标且不是 V2 时跳过
          if [[ "$TARGET" != "All" && "$TARGET" != "V2" ]]; then
            echo "⏭️ 用户选择 ${TARGET}，跳过 V2 检查"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL=$(cat ./V2/VERSION-GLOBAL)

          # 手动指定版本号（仅单一目标时生效）
          if [[ -n "$VER_INPUT" && "$TARGET" == "V2" ]]; then
            verify "$VER_INPUT"
            echo "👉 V2 使用手动版本: ${VER_INPUT}"
            echo "version=${VER_INPUT}" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 强制重建：直接使用当前跟踪版本
          if [[ "$FORCE" == "true" ]]; then
            echo "🔨 强制重建 V2，使用当前跟踪版本: ${LOCAL}"
            echo "version=${LOCAL}" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 自动：拉取远端最新版本并比对
          REMOTE=$(curl -fsSL "https://resource.1panel.pro/v2/stable/latest")
          verify "$REMOTE"
          if [[ "$REMOTE" == "$LOCAL" ]]; then
            echo "🟢 V2 无更新: ${LOCAL}"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
          else
            echo "🟡 V2 有新版本: ${LOCAL} -> ${REMOTE}"
            echo "version=${REMOTE}" >> "$GITHUB_OUTPUT"
            echo "bump=${REMOTE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        id: collect
        run: |
          V1="${{ steps.compare1.outputs.version }}"
          V2="${{ steps.compare2.outputs.version }}"
          if [[ -n "$V1" || -n "$V2" || "${{ inputs.force }}" == "true" ]]; then
            echo "any_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_updated=false" >> "$GITHUB_OUTPUT"
          fi

  check_images:
    name: Smoke Test Images Global
    runs-on: ubuntu-latest
    needs: check_remote
    if: needs.check_remote.outputs.any_updated == 'true'
    outputs:
      v1_pass: ${{ steps.smoke_v1.outputs.pass }}
      v2_pass: ${{ steps.smoke_v2.outputs.pass }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke Test V1
        id: smoke_v1
        continue-on-error: true
        env:
          VERSION: ${{ needs.check_remote.outputs.v1_version }}
        run: |
          set -e
          bash .github/scripts/smoke-test.sh V1 "$VERSION" ./V1 ./V1/Dockerfile-Global 1Panel.db 1panel
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: Smoke Test V2
        id: smoke_v2
        continue-on-error: true
        env:
          VERSION: ${{ needs.check_remote.outputs.v2_version }}
        run: |
          set -e
          bash .github/scripts/smoke-test.sh V2 "$VERSION" ./V2 ./V2/Dockerfile-Global core.db 1panel-core 1panel-agent
          echo "pass=true" >> "$GITHUB_OUTPUT"

      - name: Fail on Smoke Failure
        if: steps.smoke_v1.outputs.pass != 'true' || steps.smoke_v2.outputs.pass != 'true'
        run: |
          echo "::error::存在冒烟测试失败的目标，失败目标将跳过构建推送"
          exit 1

  build_images:
    name: Build & Push Images Global
    runs-on: ubuntu-latest
    needs: [check_remote, check_images]
    if: always() && needs.check_remote.outputs.any_updated == 'true'
    outputs:
      v1_built: ${{ steps.build_v1.outputs.built }}
      v2_built: ${{ steps.build_v2.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push V1
        id: build_v1
        continue-on-error: true
        if: needs.check_remote.outputs.v1_version != '' && needs.check_images.outputs.v1_pass == 'true'
        env:
          VERSION: ${{ needs.check_remote.outputs.v1_version }}
        run: |
          set -euo pipefail
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          TAGS=("${USERNAME}/1panel:global-${VERSION}" "${USERNAME}/1panel:global-v1")
          TAG_ARGS=""
          for t in "${TAGS[@]}"; do TAG_ARGS="${TAG_ARGS} -t ${t}"; done
          echo "🚀 构建并推送 V1: ${TAGS[*]}"
          docker buildx build --push \
            --platform linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x \
            --file ./V1/Dockerfile-Global \
            --build-arg "PANELVER=${VERSION}" \
            ${TAG_ARGS} \
            ./V1
          echo "✅ V1 推送完成"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Build & Push V2
        id: build_v2
        continue-on-error: true
        if: needs.check_remote.outputs.v2_version != '' && needs.check_images.outputs.v2_pass == 'true'
        env:
          VERSION: ${{ needs.check_remote.outputs.v2_version }}
        run: |
          set -euo pipefail
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          TAGS=("${USERNAME}/1panel:global-${VERSION}" "${USERNAME}/1panel:global-v2")
          TAG_ARGS=""
          for t in "${TAGS[@]}"; do TAG_ARGS="${TAG_ARGS} -t ${t}"; done
          echo "🚀 构建并推送 V2: ${TAGS[*]}"
          docker buildx build --push \
            --platform linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x \
            --file ./V2/Dockerfile-Global \
            --build-arg "PANELVER=${VERSION}" \
            ${TAG_ARGS} \
            ./V2
          echo "✅ V2 推送完成"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Fail on Build Failure
        if: >
          (needs.check_remote.outputs.v1_version != '' && needs.check_images.outputs.v1_pass == 'true' && steps.build_v1.outputs.built != 'true')
          || (needs.check_remote.outputs.v2_version != '' && needs.check_images.outputs.v2_pass == 'true' && steps.build_v2.outputs.built != 'true')
        run: |
          echo "::error::存在构建/推送失败的目标，失败目标将不回写版本"
          exit 1

  bump_version:
    name: Update VERSION-GLOBAL & Commit
    runs-on: ubuntu-latest
    needs: [check_remote, build_images]
    if: always() && needs.check_remote.outputs.any_updated == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write VERSION-GLOBAL files
        run: |
          V1_BUILT="${{ needs.build_images.outputs.v1_built }}"
          V2_BUILT="${{ needs.build_images.outputs.v2_built }}"
          V1_BUMP="${{ needs.check_remote.outputs.v1_bump }}"
          V2_BUMP="${{ needs.check_remote.outputs.v2_bump }}"
          if [[ "$V1_BUILT" == "true" && -n "$V1_BUMP" ]]; then
            printf '%s\n' "$V1_BUMP" > ./V1/VERSION-GLOBAL
            echo "✅ 写入 V1/VERSION-GLOBAL = ${V1_BUMP}"
          fi
          if [[ "$V2_BUILT" == "true" && -n "$V2_BUMP" ]]; then
            printf '%s\n' "$V2_BUMP" > ./V2/VERSION-GLOBAL
            echo "✅ 写入 V2/VERSION-GLOBAL = ${V2_BUMP}"
          fi

      - name: Commit & Push
        run: |
          V1_BUILT="${{ needs.build_images.outputs.v1_built }}"
          V2_BUILT="${{ needs.build_images.outputs.v2_built }}"
          V1_BUMP="${{ needs.check_remote.outputs.v1_bump }}"
          V2_BUMP="${{ needs.check_remote.outputs.v2_bump }}"
          PANELVER=""
          if [[ "$V2_BUILT" == "true" && -n "$V2_BUMP" ]]; then
            PANELVER="$V2_BUMP"
          elif [[ "$V1_BUILT" == "true" && -n "$V1_BUMP" ]]; then
            PANELVER="$V1_BUMP"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./V1/VERSION-GLOBAL ./V2/VERSION-GLOBAL
          if git diff --cached --quiet; then
            echo "ℹ️ 无版本变化需要提交"
            exit 0
          fi
          git commit -m "chore: 1Panel升级到 ${PANELVER}"
          git push